[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "promptblame"
dynamic = ["version"]
description = "Attribute each part of an LLM response to the system prompt or user prompt instruction that produced it"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Marco Baleato Domínguez" }]
keywords = ["llm", "prompt-engineering", "evaluation", "ci", "system-prompt", "attribution", "explainability", "streamlit", "claude", "openai", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The Anthropic and OpenAI SDKs are installed by default; the latter covers
# OpenAI and any compatible endpoint (Ollama, OpenRouter, Mistral, vLLM...).
# The UI and Gemini are extras. Each SDK is capped at its major version so a
# release with breaking changes doesn't break existing installs.
# python-dotenv loads a .env file with keys and defaults (see .env.example).
dependencies = ["anthropic>=2.9.0,<3", "openai>=3.0,<4", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
app = ["streamlit>=1.67,<2"]
gemini = ["google-genai>=1.51,<4"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1"]
all = ["promptblame[app,gemini,api]"]

[project.scripts]
promptblame = "promptblame.cli:main"

[project.urls]
Homepage = "https://github.com/marcobd3/PromptBlame"
Documentation = "https://github.com/marcobd3/PromptBlame#readme"
Repository = "https://github.com/marcobd3/PromptBlame"
Issues = "https://github.com/marcobd3/PromptBlame/issues"
Changelog = "https://github.com/marcobd3/PromptBlame/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.14", "mypy>=1.18", "build>=1.3", "twine>=6.2"]

# --- Build ----------------------------------------------------------------------

[tool.hatch.version]
path = "src/promptblame/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/promptblame"]

[tool.hatch.build.targets.sdist]
include = ["src/promptblame", "tests", "README.md", "CHANGELOG.md", "SECURITY.md", "LICENSE", ".env.example"]

# --- Tests ----------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
filterwarnings = ["error::DeprecationWarning:promptblame"]

# --- Lint y tipos -----------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # orden de imports
    "UP",           # sintaxis moderna
    "B",            # bugbear
    "S",            # bandit (seguridad)
    "SIM",          # simplificaciones
    "RUF",          # reglas propias de ruff
    "PT",           # estilo de pytest
    "C4",           # comprehensions
]
ignore = [
    "E501",  # la longitud de línea la gestiona ruff format
    "RUF001", "RUF002", "RUF003",  # «comillas» y caracteres no ASCII: el proyecto está en español
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert y contraseñas de prueba

[tool.mypy]
python_version = "3.11"
files = ["src/promptblame"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["streamlit.*", "google.*", "openai.*", "uvicorn.*"]
ignore_missing_imports = true
